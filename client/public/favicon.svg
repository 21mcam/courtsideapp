<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Courtside "C" mark. Colors match the default brand accent
       (indigo, client/src/theme.js: brand-500 -> brand-700). A static
       favicon can't read the page's CSS variables, so the default
       accent's hex values are baked in. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <path d="M 41.9 22.1 A 14 14 0 1 0 41.9 41.9"
        fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
</svg>
